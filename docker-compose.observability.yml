# Stack observability + session store Kartolo — Redis + Loki + Alloy.
#
# Backend & frontend dijalankan native (tsx / vite), TIDAK di compose ini.
# Postgres juga TIDAK di compose ini — tetap di host :5433.
# Backend menulis file log ke host lalu hardlink ke ./logloki/. Alloy membaca
# ./logloki/ via bind mount, mem-parsing, dan push ke Loki.
#
# Jalankan : docker compose -f docker-compose.observability.yml up -d
# Hentikan : docker compose -f docker-compose.observability.yml down
#
# Grafana SENGAJA belum disertakan (ditunda). Loki bisa di-query langsung
# via gateway endpoint /api/v1/logs/* atau curl ke http://127.0.0.1:3100.

services:
  redis:
    image: redis:7.4-alpine
    container_name: kartolo-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - kartolo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: kartolo-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - kartolo-loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: kartolo-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    # UI Alloy hanya untuk debug; tidak di-expose ke host (Docker Desktop
    # kadang block port 12345). Akses via `docker exec` kalau perlu.
    expose:
      - "12345"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Seluruh folder kartoloapp di-mount read-only supaya hardlink di
      # logloki/ ter-resolve konsisten (inode sama lintas mount).
      - ./:/logs-root:ro
      - kartolo-alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  kartolo-redis-data:
  kartolo-loki-data:
  kartolo-alloy-data:
